<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разметка пар</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --mute:#6b6b70; --line:#dedcd6;
          --yes:#1f7a4a; --no:#b23b31; --unk:#7a6a1f; --focus:#2457c5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:18px/1.6 Georgia, "PT Serif", "Times New Roman", serif; }
  header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line);
           padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
           font-family:system-ui, "Segoe UI", sans-serif; font-size:15px; }
  header .count { font-weight:600; }
  .bar { flex:1 1 160px; height:6px; background:var(--line); border-radius:3px; overflow:hidden; min-width:120px; }
  .bar i { display:block; height:100%; background:var(--focus); width:0; }
  header button { font:inherit; padding:6px 12px; border:1px solid var(--ink); background:var(--ink); color:#fff;
                  border-radius:6px; cursor:pointer; }
  header .ghost { background:transparent; color:var(--ink); border-color:var(--line); }
  main { max-width:780px; margin:0 auto; padding:16px; }
  .help { font:14px/1.5 system-ui, "Segoe UI", sans-serif; color:var(--mute); margin:4px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px;
          margin:0 0 18px; scroll-margin-top:80px; }
  .card.cur { border-color:var(--focus); box-shadow:0 0 0 2px var(--focus); }
  .num { font:600 13px system-ui, "Segoe UI", sans-serif; color:var(--mute); }
  .lbl { font:600 12px system-ui, "Segoe UI", sans-serif; text-transform:uppercase; letter-spacing:.06em;
         color:var(--mute); margin-top:10px; }
  .q { font-size:20px; font-weight:bold; }
  .p { white-space:pre-wrap; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; font-family:system-ui, "Segoe UI", sans-serif; }
  .btns button { font:inherit; font-size:15px; padding:8px 14px; border-radius:6px; cursor:pointer;
                 border:1px solid var(--line); background:#fff; color:var(--ink); }
  .btns button kbd { font:12px monospace; color:var(--mute); margin-right:6px; }
  .btns button.on[data-v=relevant] { background:var(--yes); border-color:var(--yes); color:#fff; }
  .btns button.on[data-v=not_relevant] { background:var(--no); border-color:var(--no); color:#fff; }
  .btns button.on[data-v=unsure] { background:var(--unk); border-color:var(--unk); color:#fff; }
  .btns button.on kbd { color:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171a; --card:#212125; --ink:#ececf0; --mute:#9a9aa2; --line:#36363c; --focus:#6c95ff; }
    header button { color:#17171a; }
    .btns button { background:var(--card); }
  }
</style>
</head>
<body>
<header>
  <span class="count" id="count"></span>
  <span class="bar"><i id="bar"></i></span>
  <button class="ghost" id="next">К первой неразмеченной</button>
  <button id="dl">Скачать разметку</button>
</header>
<main>
  <p class="help">Отвечает ли фрагмент на запрос? Клавиши: <b>1</b> — релевантен, <b>2</b> — не релевантен,
  <b>3</b> — не понять; ↑/↓ или j/k — соседняя карточка. После ответа фокус переходит к следующей.
  Разметка сохраняется в браузере автоматически; в конце нажмите «Скачать разметку».</p>
  <div id="list"></div>
</main>
<script>
const PAIRS = [{"id": 1, "q": "Есть ли метро в Нижнем Новгороде?", "p": "Улица Юлиуса Фучика (Нижний Новгород) Недалеко от улицы находится станция Нижегородского Метро — Парк культуры"}, {"id": 2, "q": "Что означает слово \"Эли́зиум\"?", "p": "Шалом Шало́м () — слово на иврите, означающее \"мир\". Слово может означать как мир между двумя сущностями (например, между Богом и человеком или между двумя странами), так и внутренний мир или ментальный баланс индивидуума."}, {"id": 3, "q": "Возле какой реки произошло Мианкальское восстание?", "p": "Каяла Кая́ла, Кая́лы (от тюрк. \"kajaly\" «скалистая») — река, упоминаемая в произведении древнерусской литературы «Слово о полку Игореве». Возле Каялы, согласно «Слову», произошло сражение князя Игоря Святославича с половцами в 1185 году."}, {"id": 4, "q": "Когда был построен Лувр?", "p": "Гужон, Жан Но, наверное, самой значительной работой Гужона совместно с Леско стало участие в 1548—1562 годах в строительстве нового здания Лувра. Гужон здесь выступал не только в роли скульптора, но и принимал участие в разработке архитектурного проекта. Мастер создавал скульптурное оформление дворового фасада (конец 1540-х — 1550-е годы). Для Зала кариатид в Лувре Гужон исполнил женские фигуры (1550 год), поддерживающие кафедру. Леско и Гужон придали Лувру тот облик, который, несмотря на многочисленные последовавшие переделки, сохранился до настоящего времени."}, {"id": 5, "q": "Какая общая стоимость Мастер-Билдинга на июнь 2019?", "p": "Мастер-билдинг Открытие Мастер-Билдинга практически совпало с началом Великой депрессии в США. Рынок недвижимости, равно как и рынок ценных бумаг, стремительно обрушился. Вложения в недвижимость, сделанные летом 1929 года, к концу того же года обесценились приблизительно в два раза. Медианная цена квадратного фута недвижимости на Манхэттене, составлявшая в 1929 году 3,82 долларов, упала в 1932 году до 1,61 долларов. Девелоперы не справлялись с обязательствами по ипотекам. Пик ипотечных дефолтов пришёлся на 1932 год, когда только на Манхэттене было закрыто продажей зданий () более 900 ипотек (при нормальном уровне около 100). Более 80 % облигационных займов 1925—1926 годов закончились дефолтами. В 1933 и 1934 годах на рынке вообще не было никаких продаж, кроме принудительных закрытий ипотек. Строительная активность с 1932 года и до конца Второй мировой войны упала до нуля; если в 1930 году в Нью-Йорке было построено 45 зданий выше 70 м (абсолютный рекорд), то в 1935 — ни одного. Вложения в недвижимость, сделанные в конце 1920-х годов, вышли на нулевую рентабельность только к 1960 году."}, {"id": 6, "q": "Сколько лет Вита́лий Ива́нович Чу́ркин представлял Россию в Совете Безопасности ООН?", "p": "Чуркин, Геннадий Иванович Генна́дий Ива́нович Чу́ркин (1937—2016) — советский агроном и российский политический деятель. Депутат Государственной думы 1, 2 и 3 созывов."}, {"id": 7, "q": "Когда начался арабо-израильский конфликт?", "p": "Святая земля Начиная с 60-х годов XX века территория Святой земли является предметом арабо-израильского конфликта."}, {"id": 8, "q": "Сколько лет продолжалась Гражданская война на Дону?", "p": "Гражданская война Гражданские войны с конца Второй мировой войны имели продолжительность в среднем чуть более четырёх лет, что является существенным увеличением с 1,5 лет, средней длительности войн в течение 1900—1944 годов. В то время как уровень возникновения новых гражданских войн был относительно постоянен, начиная с середины XIX века, возрастающая продолжительность этих войн привела к возрастанию количества войн, происходящих в каждый данный момент времени. К примеру, не более пяти гражданских войн происходили одновременно в начале XX века, в то время как более 20 одновременных войн случались в мире в конце Холодной войны, прежде чем вновь значительно упасть в связи с тем, что конфликты, связанные с противостоянием сверхдержав, пришли к своему концу."}, {"id": 9, "q": "Сколько базовых районов было в период Афганской войны?", "p": "Кокари-Шаршари Расположен на горном участке афгано-иранской границы в провинции Герат — запад республики Афганистан. «Кокари-Шаршари» — второй после Джавара, из числа трёх наиболее крупных приграничных базовых районов афганских моджахедов в период Афганской войны (1979—1989), наряду с «Джавара» и «Тора-Бора»."}, {"id": 10, "q": "Где родился Адо́льф Ги́тлер?", "p": "Гитлер-Барский, Иосиф Ио́сиф Ги́тлер-Ба́рский (יוסף גיטלער־בארסקי, , 3 марта 1898 года, Варшава, Царство Польское, Российская империя — 28 мая 1990 года, Варшава, Польша) — общественный деятель еврейской общины Польши, коммунистический деятель, сотрудник Центральной еврейской исторической комиссии, польский , генеральный секретарь польского отделения Джойнта (1945—1950 гг.), главный исполнительный директор PKO Bank Polski (1950—1953 гг.), многолетний директор кондитерской фабрики , депутат ."}, {"id": 11, "q": "В каком городе родился И́горь Миха́йлович Дья́конов?", "p": "Ананьевский, Игорь Михайлович И́горь Миха́йлович Ана́ньевский (род. 16 октября 1956 года, Златоуст, Челябинская область) — российский , специалист в области математической теории управления и управления динамическими системами. Лауреат премии имени А. А. Андронова"}, {"id": 12, "q": "Когда родился Борис Николаевич Абрамов?", "p": "Абрамов, Александр Миронович В 1907 году Абрамов женился на дочери отставного полковника — Евгении Васильевне Гущиной. В 1908 году у них родился сын Борис. После эмиграции генерала они остались в России."}, {"id": 13, "q": "Где родился Терри Пратчетт?", "p": "Терри Пратчетт: Выбирая умереть «Те́рри Пра́тчетт: Выбира́я умере́ть» () — документальный телевизионный фильм компании BBC, в котором известный писатель Терри Пратчетт освещает проблему эвтаназии, общественного мнения об эвтаназии, её правовой статус в разных странах, и показывает процесс ассистируемого самоубийства на примере неизлечимо больного человека, Питера Смедли, который согласился умереть в присутствии телекамеры и съёмочной группы, приняв смертельное вещество. Действие происходит в Швейцарии, где ассистируемое самоубийство () разрешено законом."}, {"id": 14, "q": "Где происходит действие манги Future Diary?", "p": "Nononono — манга авторства Окамото Линн, также известного как автор манги \"Elfen Lied\". Манга выходила с 2007 года в журнале \"Young Jump\", сейчас насчитывается 13 томов, манга официально считается законченной. События вымышлены, действие разворачивается в Японии второй половины XX века. Сюжет вертится вокруг молодой школьницы, Нономии Ноно, вынужденной переодеваться мужчиной. Большинство героев манги — школьники, занимающиеся прыжками с трамплина. Название манги происходит от полного имени главной героини: Ноно(мии) Ноно."}, {"id": 15, "q": "Когда была выпущена первая часть из серии Final Fantasy?", "p": "Final Fantasy Многие из игр серии получили отражение в виде романов и манги. Первая официальная новеллизация состоялась ещё в 1989 году, когда на бумагу лёг сюжет \"Final Fantasy II\", первая манга была издана в 1992 году и представляла собой адаптацию сценария \"Final Fantasy III\". Впоследствии такая практика участилась, вышел роман \"Final Fantasy: The Spirits Within\", две новеллы по \"Final Fantasy VII\", манга \"Final Fantasy Crystal Chronicles\", тексты на основе \"Final Fantasy XI\" продолжают публиковаться по сей день. Сериал \"Final Fantasy: Unlimited\", закончившись в формате аниме, продолжился в виде манги, кроме того, по нему, как и по \"Final Fantasy Tactics Advance\", была сыграна радиопостановка."}, {"id": 16, "q": "Когда родился Шарль-Ками́ль Сен-Са́нс?", "p": "Карл IX (король Франции) Шарль Валуа родился 27 июня 1550 года в королевском замке Сен-Жермен-ан-Лэ. До восшествия на престол носил титул герцога Орлеанского."}, {"id": 17, "q": "Когда была использована первая банковская карта?", "p": "Микрон (компания) В апреле 2016 г. ООО «Ситроникс Смарт Технологии» (входит в Группу «Микрон») начало массовый выпуск банковских карт НСПК «МИР» для мордовского «КС Банка» на микроконтроллере \"Микрона\". Это первый выпуск банковских карт НСПК \"МИР\" на банковском чипе отечественной разработки и производства."}, {"id": 18, "q": "Когда Ти́дус появился как главный герой в компьютерной игре?", "p": "Жебровский, Михал В 2011 озвучивал главного героя компьютерной игры \"\". В том же году начал сниматься в медицинском телесериале «В добре и в зле» в роли профессора-хирурга Анджея Фальковича, позднее этот герой стал одним из главных в сериале. Жебровский за эту роль получил три награды Telekamery в 2015, 2016 и 2017 году соответственно."}, {"id": 19, "q": "Когда Латвия вошли в состав СССР?", "p": "Ввод советских войск в Латвию Ввод советских войск в Латвию — эпизод латвийской истории, в ходе которого 17 июня 1940 года в Латвию вошли части советской Красной Армии. В это время после ультиматума СССР в Латвии 20 июня 1940 года было создано новое правительство во главе с микробиологом Августом Кирхенштейном. Действующий глава государства Карлис Улманис бездействовал.Латвийская Республика, в целях обеспечения безопасности СССР и укрепления своей собственной независимости, предоставляет Союзу право иметь в городах Лиепая (Либава) и Вентспилс (Виндава) базы военно-морского флота и несколько аэродромов для авиации, на правах аренды по сходной цене. Точные места для баз и аэродромов отводятся и их границы определяются по взаимному соглашению."}, {"id": 20, "q": "Какой ученый первым сказал, что Земля вертится вокруг Солнца?", "p": "Космология Большинство древнегреческих учёных поддерживали геоцентрическую систему мира, согласно которой в центре Вселенной находится неподвижная шарообразная Земля, вокруг которой обращаются пять планет, Солнце и Луна. Предложенная Аристархом Самосским гелиоцентрическая система мира, по-видимому, не получила поддержки большинства древнегреческих астрономов."}, {"id": 21, "q": "Сколько партий в Верховной Раде Украины в 2019 году?", "p": "Верховная рада Украины VII созыва Ранее большинство в Верховной Раде составляла Партии регионов. После начала массовых протестов в Киеве и других городах страны Партию регионов начали покидать депутаты и чиновники различного уровня. Из парламентской фракции «регионалов» вышли более 70 депутатов. 22 февраля 2014 года в отставку подали спикер Верховной Рады Владимир Рыбак и первый вице-спикер Игорь Калетник. Новым спикером избран Александр Турчинов. 24 февраля глава фракции Александр Ефремов объявил, что она переходит в оппозицию. 25 февраля об этом же объявила фракция Компартии Украины."}, {"id": 22, "q": "В результате чего сформировался остров Рапа-Ити?", "p": "Рапа-Ити Рапа-Ити () — крупнейший и единственный обитаемый остров из Островов Басса во Французской Полинезии. Кроме Рапа-Ити острова Басса включают необитаемые острова Маротири. Иногда остров рассматривается как часть архипелага Тубуаи, но острова Басса и острова Острал (Тубуаи) имеют различную геологическую, языковую и культурную историю, поэтому правильнее выделять их в самостоятельный архипелаг. В европейской литературе и в повседневном общении остров называют просто \"Рапа\". Историческое название — \"Опаро\". Расположен в 1240 км к югу острова Таити и в 500 км к юго-востоку от острова Раиваваэ. Остров фактически изолирован от остальной Полинезии из-за своей удаленности как от других островов, так и от основных морских транспортных путей."}, {"id": 23, "q": "Когда была отменена смертная казнь в Российской Федерации?", "p": "Смертная казнь в России Уложение 1845 года предусматривало смертную казнь лишь за государственные и карантинные преступления, и только после высочайшего рассмотрения приговора (то есть только после решения царя). Смертная казнь при наличии смягчающих обстоятельств заменялась бессрочной каторгой или каторгой на срок 15-20 лет и не применялась к лицам моложе 21 года и старше 70 лет. Военно-уголовное законодательство устанавливало, что смертной казнью карается умышленное убийство, изнасилование, разбой, грабёж, уничтожение чужого имущества. В 1881 году было отменено публичное исполнение смертной казни."}, {"id": 24, "q": "Higurashi no Naku Koro ni стала любительской игрой в Японии?", "p": "Higurashi no Naku Koro ni Все эти размышления, тем не менее, были прерваны увеличением занятости автора на его основной работе — из-за плотного графика разработку \"Higurashi no Naku Koro ni\" пришлось бы вести в более медленном темпе или же вовсе отложить её примерно на три года. Как вспоминала участница кружка, известная под псевдонимом BT, в то время Рюкиси07 «был в очень плохом состоянии» — помимо занятости на основной работе он несмотря на просьбы других членов 07th Expansion отказывался продолжать проект, считая, что уже не может ничего написать вовсе. BT решила как-нибудь поддержать сценариста и ради увеличения известности работы предложила загрузить на один из интернет-сайтов \"Onikakushi-hen\" для бесплатного скачивания. Члены кружка поддержали её инициативу и, исправив некоторые ошибки в первой главе, выложили в свободном доступе свой первый визуальный роман в мае 2004 года."}, {"id": 25, "q": "Шизофрения излечимая болезнь?", "p": "Шизофрения Большинство пациентов, страдающих шизофренией, могут лечиться амбулаторно бо́льшую часть времени. Даже в остром периоде болезни нередко возможно амбулаторное лечение. Преимущества амбулаторной и стационарной форм лечения должны быть тщательно взвешены, прежде чем будет принято решение. Госпитализация может потребоваться при тяжёлых эпизодах шизофрении. Она может быть добровольной или, если это позволяет местное законодательство в области охраны психического здоровья, недобровольной (препровождение в гражданском порядке)."}, {"id": 26, "q": "Когда появилась Resident Evil 4 в Японии?", "p": "Список персонажей серии Resident Evil «Resident Evil» (), также известная в Японии, как — медиа-франшиза, принадлежащая компании Capcom и созданная Синдзи Миками под влиянием серии фильмов \"Живые мертвецы\" Джорджа Ромеро, как серия игр жанра survival horror. Первая игра серии вышла на приставке PlayStation 22 марта 1996 года. Последняя на данный момент, , вышла 24 января 2017 года на консоли PlayStation 4,XBOX 360,XBOX ONE"}, {"id": 27, "q": "Кто был разработчиком UGM-133A Трайдент II (D5)?", "p": "Афина-1c Во второй половине 1980-х годов компания «Lockheed» (ныне — «Lockheed Martin»), будучи главным разработчиком ряда баллистических ракет подводного базирования (UGM-27 «Поларис» , UGM-73 «Посейдон» и «Трайдент»), приступила к изучению проекта переоборудования своих ракет для реализации возможности запуска космических аппаратов."}, {"id": 28, "q": "Предпосылки Февральской революции 1917 года в России были сформулированы до Первой Мировой войны?", "p": "Предпосылки Февральской революции 1917 года В 1912 году ГАУ и ГУГШ, встревоженные Балканскими войнами, а также сведениями о том, что у других европейских держав запасы снарядов достигают 2000 на орудие, подняли вопрос о повышении запаса до 1500 снарядов на орудие, однако этот вопрос решён так и не был."}, {"id": 29, "q": "Как назывался первый роман Достоевского?", "p": "Достоевский, Фёдор Михайлович За рубежом был написан роман «Идиот», работу над которым Достоевский начал в сентябре 1867 года в Женеве, продолжил там же до конца мая 1868 года, затем писал его в Веве и Милане, а закончил во Флоренции 17 (29) января 1869 года. Основную идею романа Достоевский изложил в письме из Женевы к А. Н. Майкову от 31 декабря 1867 (12 января 1868) года: «Давно уже мучила меня одна мысль, но я боялся из неё сделать роман, потому что мысль слишком трудная и я к ней не приготовлен, хотя мысль вполне соблазнительная и я люблю её. Идея эта — изобразить вполне прекрасного человека. Труднее этого, по-моему, быть ничего не может, в наше время особенно». «Идиот» — одно из самых сложных произведений Достоевского. Трагичность романа заключается в том, что «Князю-Христу» (Мышкину — любимому герою писателя) вмешательством в судьбы других персонажей никого не удаётся осчастливить, не удаётся победить враждебные силы, жертвой которых становится и он сам."}, {"id": 30, "q": "Кто запустил первый искусственный спутник Земли?", "p": "Спутниковый кризис «Спутниковым кризисом» на Западе принято называть цепь событий, связанных с началом Космической гонки. «Кризис» начался 4 октября 1957, когда Советский Союз запустил в космос первый искусственный спутник Земли."}, {"id": 31, "q": "В каком году родился Э́дмунд Спе́нсер?", "p": "Бреслин, Спенсер Спе́нсер Бре́слин (; родился 18 мая 1992, Нью-Йорк, Нью-Йорк, США) — американский актёр, начавший свою карьеру ещё ребёнком, музыкант."}, {"id": 32, "q": "Есть ли по сценарию в сериале «Вавилон-5» герой российского происхождения?", "p": "Список персонажей телесериала «Вавилон-5» Кош () — персонаж научно-фантастического сериала «Вавилон-5». Под именем Кош в сериале существовало два персонажа — Кош и Улкеш, пришедший на место погибшего Коша."}, {"id": 33, "q": "Когда был открыт планетарий в Санкт-Петербурге?", "p": "Мюзик-холл (театр, Санкт-Петербург) В конце 1970-х годов здание бывшего Оперного зала Народного дома (которое в разное время занимали филиалы театра им. Кирова, театра Музыкальной комедии, а до передачи «Мюзик-Холлу» занимал кинотеатр «Великан» и Планетарий) было передано возрожденному «Мюзик-Холлу», но только в 1988 году приняло своих первых зрителей."}, {"id": 34, "q": "Как называлась первая столица Дагестана?", "p": "Казикумухское шамхальство Кроме того, Эвлия Челеби называет «татарский город» Татартуп (ныне локализуемый недалеко от села Эльхотова), а не Кумук, «в древние времена столицей падишахов Дагестана»."}, {"id": 35, "q": "Когда родился Па́вел Ива́нович Ме́льников?", "p": "Пётр (Соколов) Архиепископ Пе́тр (в миру Па́вел Ива́нович Соколо́в; 1 ноября 1863, село , Вольский уезд, Саратовская губерния — 16 мая 1937) — епископ Русской православной церкви, архиепископ Воронежский и Задонский."}, {"id": 36, "q": "В каком возрасте Си́львио Берлуско́ни стал политиком?", "p": "Политика (управление) Планируемые последствия политики широко варьируют в зависимости от организации и контекста. В целом, политика, как правило, вводится, чтобы избежать некоторых негативных явлений, которые были замечены в организации, или добиться каких-либо положительных выгод."}, {"id": 37, "q": "Какое основное назначение диода Зенера?", "p": "Стабилитрон Не являются стабилитронами лавинно-пролётные диоды, туннельные диоды и стабисторы. Стабисторы — это маломощные диоды, предназначенные для работы на прямом токе в стабилизаторах напряжения и как датчики температуры. Характеристики стабисторов в обратном включении не нормировались, а подача на стабистор обратного смещения допускалась только «при переходных процессах включения и выключения аппаратуры». Обращённые диоды в различных источниках определяются и как подкласс стабилитронов, и как подкласс туннельных диодов. Концентрация легирующих примесей в этих диодах настолько велика, что туннельный пробой возникает при нулевом обратном напряжении. Из-за особых физических свойств и узкой области применения они обычно рассматриваются отдельно от стабилитронов и обозначаются на схемах особым, отличным от стабилитронов, символом."}, {"id": 38, "q": "Сколько братьев и сестер было в семье Джанет Джексон?", "p": "Джексон, Джермейн Джермейн является четвёртым ребёнком и Кэтрин Джексон. Он родился 11 декабря 1954 года в Гэри (шт. Индиана). Других детей Джозефа и Кэтрин звали Ребби, Джеки, Тито, Ла Тойя, Марлон, Майкл, Рэнди и Джанет. Мать воспитывала его как Свидетеля Иеговы, но после поездки в Бахрейн в 1989 году он принял ислам. Джермейн Джексон участвовал в группе The Jackson 5 и помогал своему брату Майклу на протяжении многих лет. В 1973 году Джермейн окончил высшую школу Бирмингема в Лос-Анджелесе (шт. Калифорния)."}, {"id": 39, "q": "Когда Ти́дус появился как главный герой в компьютерной игре?", "p": "Assassin’s Creed II Assassin’s Creed II ( ; ) — мультиплатформенная компьютерная игра в жанре action-adventure, продолжение игры \"Assassin’s Creed\" от компании Ubisoft . Официальный анонс состоялся 16 апреля 2009 года в журнале Game Informer. В рамках сюжетной кампании Дезмонд Майлс, главный герой герой сюжетной линии в настоящем времени переживает воспоминания своего дальнего предка — Эцио Аудиторе да Фиренце, молодого флорентийского аристократа. Игрок побывает в Италии эпохи Возрождения (события игры происходят с 1476 по 1499 год) и встретится с выдающимися людьми того времени — к примеру, с четой Медичи, Леонардо да Винчи и Никколо Макиавелли, а во врагах у героя будут числиться Родриго Борджиа, Франческо Пацци и Джироламо Савонарола. У персонажа появятся новые способности, к примеру, плавать и нырять, возможность выхватить оружие у врага во время боя."}, {"id": 40, "q": "В каком году врач и путешественник Джон Рэй записал рассказы эскимосов?", "p": "Экспедиция Франклина (1845—1847) В надежде найти ещё какие-либо письменные свидетельства участи людей Франклина лейтенант армии США Фредерик Сватка организовал между 1878 и 1880 годами ещё одну экспедицию на остров. Дойдя на шхуне \"Eothen\" до Гудзонова залива, он собрал команду, среди которой были и эскимосы, помогавшие некогда Фрэнсису Холлу. Отправившись дальше на север на «\"трёх санях, с запряжёнными в них более чем сорока собаками, относительно небольшим объёмом продовольствия, но с большим количеством оружия и боеприпасов\"», Сватка записывал рассказы эскимосов, посещал известные и вероятные точки маршрута экспедиции, а также место зимовки на острове Кинг-Уильям. В ходе экспедиции был найден скелет лейтенанта Джона Ирвинга."}, {"id": 41, "q": "Где родился Фидель Кастро?", "p": "Кастро, Фидель Имя Фиделя Кастро носят площадь в Москве и улица в селе Ир в Северной Осетии. Улицы его имени могут также появиться в Сочи и Махачкале."}, {"id": 42, "q": "Откуда пошла фраза: \"В Багдаде все спокойно\"?", "p": "Как я стал предателем «Как я стал предателем» — второй по дате выхода студийный альбом российской группы АукцЫон. Альбом стал первым официально вышедшим студийным творением группы, сначала во Франции, а затем и на территории СССР (уже после начала записи \"В Багдаде всё спокойно\"). Этот альбом попал в книгу «100 магнитоальбомов советского рока» Александра Кушнира."}, {"id": 43, "q": "Когда родился Шарль-Ками́ль Сен-Са́нс?", "p": "Сен-Жорж де Марсе, Шарль-Эктор де Родился Париже в семье бывших членов реформатской церкви. Опасаясь религиозных гонений, семья переехала в Германию. Шарль принимал участие в Войне за испанское наследство, сражаясь в армии Брабанта. В 1711 году уволился из армии и переехал в Шварценау, в графстве Сайн-Витгенштейн.. Здесь увлёкся мистицизмом и занимался изучением сочинений Антуанетты Буриньон. В 1713—1716 годах неоднократно бывал в Швейцарии, где познакомился с трудами Мадам Гюйон. Вернувшись в Германию в 1719 году, Сен-Жорж обосновался в Берлебурге. Берлебург в это время — центр немецкого пиетизма, место издания Берлебургской библии (1726—1742). Сен-Жорж стал президентом местного Филадельфийского общества и оставался им вплоть до 1724 года. В Берлебурге им написаны и опубликованы его религиозные труды — с 1738 года и до смерти в 1755 году."}, {"id": 44, "q": "Куда впадает Миссу́ри?", "p": "USS Missouri (BB-63) Линко́р «Миссу́ри» (ББ-63) (, «Большой Мо» ()) — является третьим в серии линкоров типа «Айова», последний американский линкор. Третий военный корабль с таким именем."}, {"id": 45, "q": "Как назывался Петербу́ргский метрополите́н до 1992 года?", "p": "Санкт-Петербургская губерния Санкт-Петербу́ргская (Санктпетербу́ргская) губе́рния (с августа 1914 года — Петрогра́дская, с 1924 года — Ленингра́дская) — административно-территориальная единица Российской империи, Российской республики и РСФСР, существовавшая в 1710—1927 годах. Губернский город — Санкт-Петербург (затем \"Петроград\" и \"Ленинград\" соответственно)."}, {"id": 46, "q": "Сколько лет правила Екатерина II?", "p": "Камер-юнкер В августе 1762 года Екатерина II утвердила доклад обер-камергера графа Шереметева, в котором, в частности, были представлены основные обязанности камер-юнкеров: они должны были дежурить при императорском величестве «по сколько ж Ея Императорское Величество указать изволит» и «во время дежурства никуда не отлучаться». При исполнении своих придворных обязанностей камер-юнкеры должны были выполнять приказы обер-камергера. Императрица своим указом от 7 июля 1762 года установила размер жалованья камер-юнкеров — 1 тысяча рублей в год (в 1727 году оно составляло 518 рублей и 55 копеек). С 1775 года жалованье выплачивалось только 12 старшим по порядку производства в чин камер-юнкерам при условии их дежурства при дворе. За время правления Екатерины II камер-юнкерами было пожаловано 123 человека, в последний год её правления 27 из них дежурили при дворе."}, {"id": 47, "q": "Как зовут главную героиню книги \"Любовь во время холеры\"?", "p": "Щелкунчик В разных редакциях есть разночтения в имени главной героини: Клара и Мари. В оригинальной книге Гофмана главную героиню зовут Мари, а Клара — это её любимая кукла."}, {"id": 48, "q": "Когда был основан Иерусалим?", "p": "История Иерусалима Иерусалим постепенно приобретает христианский облик. В 325 году римский император Константин I вернул название Иерусалим и восстановил город, как центр христианского богослужения. В том же году Иерусалим был особо отмечен в VII Каноне Первого никейского собора. Константин распорядился о сооружении в городе христианских святых мест, включая (в 335 г.) Храм Гроба Господня. Мать Константина, Елена, совершила паломничество в Иерусалим и заявила об обретении \"Христова креста\"."}, {"id": 49, "q": "В каком году была создана компания Apple?", "p": "Apple Apple ( , ) — американская корпорация, производитель персональных и планшетных компьютеров, аудиоплееров, телефонов, программного обеспечения. Один из пионеров в области персональных компьютеров и современных многозадачных операционных систем с графическим интерфейсом. Штаб-квартира — в Купертино, штат Калифорния. Благодаря инновационным технологиям и эстетичному дизайну, корпорация Apple создала в индустрии потребительской электроники уникальную репутацию, сравнимую с культом. Является первой американской компанией, чья капитализация превысила 1,044 трлн долларов США. Это произошло во время торгов акциями компании 10 сентября 2018 года. В тот же день компания стала самой дорогой публичной компанией за всю историю, превысив капитализацию предыдущего рекордсмена — компании PetroChina (1,005 трлн долларов в ноябре 2007 года)."}, {"id": 50, "q": "Когда Влади́мир Влади́мирович Пу́тин был выбран президентом России на первый срок?", "p": "Глава Удмуртской Республики Срок полномочий Волкова истекал в октябре 2004 года, однако было решено провести их на полгода раньше, в марте, совместив с выборами Президента России. 14 марта 2004 года состоялись вторые выборы президента Удмуртской Республики. В этот раз второй тур был возможен, однако действующий президент Александр Волков набрал 54,26 % голосов и был переизбран уже в первом туре на пятилетний срок."}, {"id": 51, "q": "Была в Таджикистане Гражданская война?", "p": "Гражданская война в Таджикистане 7 сентября Рахмон Набиев попытался тайно отбыть в родной Ходжент, который, как и Куляб, не контролировался исламистами, но его перехватили по дороге в аэропорт. В целях не допустить расправы над президентом к аэропорту прибыли 4 танка, 1 БТР и 1 БМП 201 мсд, а также 4 БТРа МВД Таджикистана. Вечером того же дня после встречи с членами Президиума Верховного Совета Таджикистана, Набиев подписал заявление об отставке. После этого политический кризис в Таджикистане окончательно приобрёл характер гражданской войны."}, {"id": 52, "q": "При каком царе России было сформировано первое стрелецкое войско?", "p": "Армия Петра I Армия Петра I — регулярная армия, созданная российским царём (позднее, императором) ПетромI на основе начавших появляться в России ещё в период царствования его отца, так называемых позднее историками, \"полков иноземного строя\", стрелецкого войска и казаков, с учётом новейших европейских достижений в этой области. «начал регулярное войско употреблять». Заменила нерегулярные поместные войска, являвшиеся феодальным пережитком, и стрелецкие части, выступившие против Петра I в период борьбы за власть и затем репрессированные им. Комплектовалась Русская армия на основе рекрутской повинности (также до середины XVIII века сохранялась обязательная служба дворян)."}, {"id": 53, "q": "Какой стиль использовал Низами́ Гянджеви́ в написании стихов?", "p": "Памятники Низами Гянджеви Па́мятники Низами́ Гянджеви́ — памятники классику персидской поэзии, уроженцу Гянджи Низами Гянджеви, установленные во многих городах мира. В Гяндже, первый памятник Низами Гянджеви был установлен в 1946 году. Архитекторами памятника стали советские архитекторы Садых Дадашев и Микаэль Усейнов, а скульптором - народный художник Азербайджанской ССР Фуад Абдурахманов. В 2009 году монумент впервые был отреставрирован за счёт государственного бюджета.В апреле 1949 года, в Баку состоялось открытие памятника, скульптором и архитекторами которого были те же, что и гянджинского памятника Низами Гянджеви, установленного в 1946 году. Пьедестал, на котором установлен памятник имеет 9-метровую длину, а статуя на нем - 6.21 января 2012 года, в мемориальном комплексе \"Хамсэ\" в Гяндже состоялось открытие второго памятника Низами Гянджеви. В Риме, памятник Низами Гянджеви был установлен по распоряжению Ильхама Алиева в честь 870-летия поэта. Памятник находится в парке Вилла Боргезе, на улице Виале Мадам Летиции. Авторами проекта стали азербайджанские художники алхаб Мамедов и Али Ибадуллаев. 20 апреля 2012 года состоялось открытие монумента.Памятник Низами Гянджеви в Пекине находится в парке Чаоян. Автором памятника является китайский художник Юань Сикунь. Памятник был установлен в честь 20-летия азербайджано-китайских дипломатических отношений.Фундамент памятника был заложен в октябре 2011 года, в рамках мероприятий, посвященных 20-летию восстановления независимости Азербайджана."}, {"id": 54, "q": "Кто такие раскольники?", "p": "Родион Раскольников Раскольников — бывший студент-юрист из Санкт-Петербурга, из-за нехватки средств вынужденный оставить учёбу в университете. Живёт крайне бедно."}, {"id": 55, "q": "В каком возрасте Ричард Хью «Ричи» Маккоу O.N.Z. начал играть в регби?", "p": "Харрис, Ричард С ранних лет Харрис увлекался регби, но ему пришлось прервать спортивную карьеру, когда он подхватил туберкулёз в подростковом возрасте. Тем не менее актёр так и остался поклонником регби до самой смерти."}, {"id": 56, "q": "Какой ученый первым сказал, что Земля вертится вокруг Солнца?", "p": "И всё-таки она вертится! «И всё-таки она вертится!» ( ) — крылатая фраза, которую якобы произнёс в 1633 году известный астроном, философ и физик Галилео Галилей, будучи вынужденным отречься перед инквизицией от своего убеждения в том, что Земля вращается вокруг Солнца, а не наоборот."}, {"id": 57, "q": "Какой король сменил религию страны, чтобы развестись с женой?", "p": "Генри Куртене, маркиз Эксетер Куртене смог наладить хорошие отношения со стремительно возвышающимся родом Болейнов. Когда король решил развестись с Екатериной Арагонской, чтобы жениться на Анне Болейн, маркиз Эксетер возглавил переговоры с папским престолом по этому вопросу. Его подпись стоит под официальной просьбой к папе об аннулировании брака. Куртене сыграл ключевую роль в отставке Томаса Уолси и в последующем суде над ним, в разводе короля и в роспуске монастырей (с 1535 года). Когда Генриху VIII стал неугоден и второй его брак, Куртене принял деятельное участие вследствие и суде по делу о государственной измене королевы Анны."}, {"id": 58, "q": "Когда был открыт планетарий в Санкт-Петербурге?", "p": "Санкт-Петербургский планетарий Санкт-Петербу́ргский планета́рий — планетарий в Санкт-Петербурге. Находится в историческом центре Санкт-Петербурга, в Петроградском районе, рядом с Кронверкским каналом в Александровским парке."}, {"id": 59, "q": "Кто был архитектором особняка О. А. Ли́ста?", "p": "Особняк Листа Некоторые элементы композиции и детали оформления особняка цитировались позднее и другими русскими зодчими. Так, в частности, по свидетельству архитектора П. Ф. Алёшина, «предметом многочисленных более и менее удачных подражений» стал венчающий здание лёгкий металлический карниз. Уильям Брумфилд называет особняк Листа «прецедентом», позволившим Фёдору Шехтелю при проектировании и строительстве в 1900—1903 годах особняка С. П. Рябушинского применить похожий композиционный приём, основанный на взаимодействии блокированных прямоугольных элементов."}, {"id": 60, "q": "Болеют псориазом животные?", "p": "Питомцы зоопарка В ярких портретах животных, созданных Чаплиной, всегда присутствует и образ человека. Рассказы из её зоопарковского цикла «открывают невидимую посетителям жизнь. Мы узнаем, какими тесными узами дружбы и разнообразного общения связаны животные с человеком. Не с глазеющей толпой, от которой животные впадают в стресс, болеют, “затаскивают” насмерть детенышей, пытаясь укрыться, а со служителем, зоотехником, врачом». И хотя люди здесь уступают первый план повествования животным, человеческое поведение, характеры проявляются и становятся особенно привлекательными именно во взаимоотношениях с четвероногими друзьями.Наиболее полные версии цикла: «My animal friends», George Routledge & Sons Ltd., Лондон, 1939."}, {"id": 61, "q": "Когда родился Никола́-Клод Фабри́ де Пейре́ск?", "p": "Клод, герцог де Шеврёз 20 апреля 1622 года в Париже 44-летний Клод де Шеврёз женился на Марии де Роган (1600—1679), вдове Шарля д’Альбера (1578—1621), герцога де Люиня, дочери Эркюля де Рогана (1568—1654), герцога де Монбазона, и Мадлен де Ленонкур (1576—1602). Дети:"}, {"id": 62, "q": "Сколько партий в Верховной Раде Украины в 2019 году?", "p": "Парубий, Андрей Владимирович 10 сентября состоялся съезд новой партии, получившей название «Народный фронт». После создания партии, Андрей Парубий принял участие в выборах в Верховную раду 26 октября 2014 года по спискам от «Народного фронта» (№ 4). На внеочередных выборах в Верховную раду партия «Народного фронта» набрала наибольшее количество голосов избирателей, что позволило ей в Верховной раде Украины VIII созыва получить 64 мандата по партийным спискам."}, {"id": 63, "q": "В каком году состоялась октябрьская социалистическая революция?", "p": "Октябрьская революция Определение «Великая Октябрьская революция» впервые появилось в декларации, оглашённой Ф. Ф. Раскольниковым от имени фракции большевиков в Учредительном собрании. К концу 1930-х годов в советской официальной историографии утвердилось название \"Великая Октябрьская социалистическая революция\". В первое десятилетие после революции она нередко именовалась \"Октябрьским переворотом\", и это название не несло в себе негативного смысла (по крайней мере, в устах самих большевиков) и представлялось более научным в концепции единой революции 1917 года. В. И. Ленин, выступая на заседании ВЦИК 24 февраля 1918 года, говорил: «Конечно, приятно и легко бывает говорить рабочим, крестьянам и солдатам, приятно и легко бывало наблюдать, как после Октябрьского переворота революция шла вперёд…»; такое название можно встретить у Л. Д. Троцкого, А. В. Луначарского, Д. А. Фурманова, Н. И. Бухарина, М. А. Шолохова; и в статье Сталина, посвящённой первой годовщине Октября (1918), один из разделов назывался «Об октябрьском перевороте». Впоследствии, однако, слово «переворот» стало ассоциироваться с заговором и захватом власти узкой группой лиц (по аналогии с дворцовыми переворотами), утвердилась концепция двух революций, и термин был изъят из официальной историографии. Зато выражение «октябрьский переворот» стало активно употребляться, уже с негативным смыслом, в литературе, критической по отношению к Советской власти: в эмигрантских и диссидентских кругах, а начиная с перестройки — и в легальной печати. Обозначение «октябрьский переворот» используется и в некоторых современных научных публикациях, например, в учебнике «История России. XX век» под редакцией А. Б. Зубова (2009) или в 5-м томе словаря «Русские писатели. 1800—1917» (2007). Философ А. П. Бутенко использует словосочетание «революционный переворот»."}, {"id": 64, "q": "Когда умер Вольфганг Амадей Моцарт?", "p": "Аугсбург Исследователи насчитали в 30 городках и имениях вокруг Аугсбурга не меньше 600 представителей рода Моцартов. Вот краткая хронология Моцартов, представленная в книге Мартина Клюгера «Аугсбургские Моцарты»: 1331 — в книге записей монастыря Oberschönenfeld впервые зафиксирована фамилия Моцарт; 1480 — в Аугсбурге в торговых книгах впервые зафиксирована фамилия Моцарт; 1486 — первое упоминание о доме, принадлежащем Моцартам: в деревне Heimberg близ Fischach; 1620 — в деревне Pfersee родился Давид Моцарт-младший, прапрадедушка Вольфганга — Амадея Моцарта; 1643 — Давид Моцарт-младший получает права гражданина Аугсбурга. В этом же году Давид Моцарт-младший женится на Марии Негеле; 1647 — у Давида Моцарта-младшего и Марии Негеле рождается сын, Ханс Георг. Он станет каменных дел мастером аугсбургского епископата и председателем цеха каменщиков в Аугсбурге; 1649 — у Давида Моцарта-младшего и Марии Негеле рождается сын Франц, прадед Вольфганга Амадея Моцарта; 1678 — Давид Моцарт-младший и его сыновья Ханс и Франц работают для Фуггеров в их владениях; 1679 — у Франца Моцарта рождается сын, Иоганн-Георг, дед Вольфганга Амадея Моцарта; 1681 — Франца Моцарт переезжает жить и работать в Фуггерай; 1718 — Иоганн-Георг Моцарт женится на дочери ткача Анне Марии Сульцер; 1719, 14 ноября — в нынешнем доме-музее Моцартов рождается Леопольд Моцарт — отец Вольфганга Амадея Моцарта; 1729—1736 — Леопольд Моцарт получает общее и музыкальное образование в коллегии Святого Сальватора в Аугсбурге; 1737 — Леопольд Моцарт записывается студентом в Зальцбургский университет; 1739 — Леопольд Моцарт уходит из Зальцбургского университета и становится придворным архиепископа Зальцбурга; 1747 — Леопольд Моцарт становится придворным музыкантом архиепископа Зальцбурга. В этом же году он женится на Анне Марии Пертл; 1747 — Леопольд Моцарт посылает прошение о сохранении за ним прав гражданина Аугсбурга. Это же прошение он повторит в 1751 году; 1751 — рождается Мария Анна, «Nannerl» — старшая сестра Вольфганга Амадея Моцарта; 1756, 27 января — рождение Вольфганга Амадея Моцарта; 1756 — в Аугсбурге печатается знаменитый учебник игры на скрипке Леопольда Моцарта; 1763 — семья Моцартов во время своего путешествия по Европе 15 дней гостит в Аугсбурге; 1766, ноябрь — семья Моцартов несколько дней гостит в Аугсбурге; 1777, октябрь — Вольфганг Амадей Моцарт 15 дней гостит в Аугсбурге. Роман с кузиной Анной Марией, «Bäsle»; 1781 — семья Моцартов посещает Аугсбург; 1782 — Вольфганг — Амадей Моцарт женится на Констанции Вебер; 1787 — в Зальцбурге умирает вице-капельмейстер архиепископа Леопольд Моцарт; 1790 — на обратном пути из Франкфурта Вольфганг — Амадей Моцарт делает остановку в Аугсбурге; 1791, 5 декабря — в Вене умирает от лихорадки Вольфганг Амадей Моцарт; 1841 — кузина Моцарта, «Bäsle», умирает в Байройте; 1858 — на доме, в котором родился Леопольд Моцарт, по адресу Frauentorsterasse 30, появляется памятная доска в честь этого события; 1937 — на Frauentorsterasse 30 открывается дом-музей Леопольда Моцарта; 1965 — умирает Каролина Грау, последняя представительница рода Моцартов в Аугсбурге."}, {"id": 65, "q": "Когда «Особняк с привидениями» появился в Токио?", "p": "Тан Эньбо В июле 1949 года Ван Вэньчэн и Лун Цзюлян приобрели особняк в пригороде Токио. 2 февраля 1950 года Рейтер в японских новостях утверждал, что Чан Кайши приобрёл особняк в пригороде Токио для высокопоставленного китайского чиновника. Ходили слухи, что Тан политический враг Гоминьдана. Чан Кайши по этому поводу заявил: «Не удивительно, что наше поражение было таким стремительным, в Шанхае и на юго-восточном побережье, — он (Тан Эньбо) уже был готов бежать!»."}, {"id": 66, "q": "M3 поставлялся на экспорт?", "p": "Вепр По состоянию на август 2013 года, на вооружение не поступал и на экспорт не поставлялся."}, {"id": 67, "q": "Что было основной задачей «Дальстро́й»?", "p": "Р-11А В 1962 году проводились испытания пяти ракет Р-11А-МВ с задачей отработки аппаратуры для будущих исследований планет Марс и Венера. Основной задачей испытаний было исследование и проверка введения и работы парашютных систем спускаемых аппаратов с различными высотами ввода тормозного каскада и раскрытия основных куполов парашютов."}, {"id": 68, "q": "Какой школы был основоположником Василий Васильевич Докуча́ев?", "p": "Докучаев, Николай Васильевич Николай Васильевич Докуча́ев (1891, Москва — 1944, Москва) — советский архитектор, градостроитель и преподаватель, архитектурный критик, один из теоретиков и пропагандистов рационализма."}, {"id": 69, "q": "Были масштабные войны в период Викториа́нской эпо́хи?", "p": "Русско-турецкая война (1686—1700) Ру́сско-туре́цкая война́ 1686—1700 — часть Великой Турецкой войны — масштабного европейского военного конфликта: войны антиосманской «Священной лиги» (Австрии, Речи Посполитой и России) с Османской империей."}, {"id": 70, "q": "Как называлась первая столица США?", "p": "Летние Олимпийские игры 1916 VI Летние Олимпийские игры, по решению МОК, принятому 27 мая 1912 года, были запланированы к проведению в 1916 году в Берлине. Столица Германской империи (Второго Рейха) получила право провести игры, оставив позади город Египта Александрия (в прошлом-Александрия Египетская), столицу Нидерландов Амстердам, столицу Бельгии Брюссель, вторую столицу Австро-Венгерской империи Будапешт (Вена - первая столица) и промышленный город США Кливленд. В связи с началом Первой мировой войны игры были отменены. К этим играм был уже готов новый стадион в Берлине. Несмотря на то, что эти, шестые, игры отменили, следующим играм — в 1920 — был присвоен следующий номер — 7."}, {"id": 71, "q": "Где происходит действие игры Alice: Madness Returns?", "p": "Alice: Madness Returns Alice: Madness Returns () — компьютерная игра, приключенческий боевик от третьего лица, разработанный китайской студией \"Spicy Horse\" и изданный компанией \"Electronic Arts\". Выпуск игры состоялся 14 июня 2011 года в США, 16 июня — в Австралии, 17 июня — в Европе и 21 июля — в Японии. Продукт разработан для персональных компьютеров под управлением операционной системы \"Windows\", а также для игровых приставок \"PlayStation 3\" и \"Xbox 360\". Дистрибьютором игры в России стала компания «1С-СофтКлаб»."}, {"id": 72, "q": "Кто был первым деканом факультета менеджмента СПбГУ?", "p": "Математико-механический факультет Санкт-Петербургского государственного университета Первым деканом факультета назначен М. Ф. Субботин, он будет возглавлять факультет до Великой Отечественной войны."}, {"id": 73, "q": "Кто снялся в главной роли в «Звёздные врата SG-1»?", "p": "Таппинг, Аманда В 1995—1997 Аманда появлялась во множестве телешоу: телефильм «Воспоминание», эпизоды в различных сериалах вроде «Строго на юг», «Редакция новостей» и «Секретные материалы» и фильмах «Донор», «Ребёнок напрокат», «Зов плоти». Её главное достижение - роль капитана Саманты Картер, в вышедшем в 1997 году телевизионном сериале «Звёздные врата SG-1»."}, {"id": 74, "q": "Когда была основана Москва?", "p": "Армяне в России Армяне живут в Москве 800 лет. В Посаде была основана армянская колония и известно, согласно церковным книгам, что между армянами и остальными жителями Москвы заключались браки и кумовство."}, {"id": 75, "q": "Когда родился Тайто Кубо?", "p": "Kylee (певица) Родилась 25 мая 1994 в семье отца-американца и матери-японки Аяко в штате Аризона; старшая из трёх детей в семье Сондерс. Хотя семья иногда вращается вокруг требований расписания старшей дочери, мать стремится уделять равное время уделять внешкольным интересам второй дочери Эшли (1998 г.р.) и сына Тайте (2000 г.р.), которые включают драму и спорт."}, {"id": 76, "q": "Кто основал студию Naughty Dog?", "p": "Naughty Dog В 2001 году студия \"Naughty Dog\" была приобретена Sony Computer Entertainment для разработки эксклюзивных игр для консолей компании."}, {"id": 77, "q": "Где находится картина \"Рождение Венеры\" на сегодняшний день?", "p": "Рождение Венеры (картина Бугро) На картине изображено не само рождение из моря, а перемещение Венеры в раковине из открытого моря в Пафос на Кипре. Раковина является типичным символом, сопровождающим изображения Венеры. Она символизирует плодородие, чувственные удовольствия и сексуальность. Сюжет и композиция напоминают одноимённую картину Сандро Боттичелли, а также «Триумф Галатеи» Рафаэля. Линии картины извилистые, мягкие и нежные. Цветовая гамма в основном светлая, в диапазоне между белым и голубым — цветами, символизирующими чистоту и божественное происхождение. Художник сделал явный акцент на фигуре Венеры, оставив других персонажей в тени. Небо на картине пасмурно, оно предвещает грозу, что может быть как символом трудностей, ожидающих любовь, символизируемую Венерой, так и просто оптическим эффектом, объясняющим, почему большинство персонажей полотна изображены в тени."}, {"id": 78, "q": "Производят ли Ту-154 в 2019 году?", "p": "Ту-154 В период с 1970-го по 1998 годы было построено 918 самолётов семейства Ту-154, из которых:"}, {"id": 79, "q": "Кто стал чемпионом мира по футболу в 2018 году?", "p": "Кострово (Московская область) В июне-июле 2018 года в Кострове, в отеле «Хилтон Гарден Инн», находился базовый лагерь чемпионов мира по футболу — сборной Франции."}, {"id": 80, "q": "В Германии разрешены однополые браки?", "p": "Гражданские партнёрства в Германии С 1 октября 2017 года после легализации в Германии однополых браков, однополые пары, состоящие в браке, получили возможность наравне с разнополыми супругами усыновлять детей вместе как пара."}, {"id": 81, "q": "Когда родился Никола́-Клод Фабри́ де Пейре́ск?", "p": "Дебюсси, Клод Родился 22 августа 1862 года в Сен-Жермен-ан-Ле (пригород Парижа) в семье мелкого торговца — владельца небольшой посудной фаянсовой лавки. Когда Клоду исполнилось два года, его отец продал свой магазинчик, и вся семья переехала в Париж, где Дебюсси-старший устроился на работу бухгалтером в частной фирме. В Париже и прошло почти всё детство Клода Дебюсси за вычетом времени Франко-прусской войны, когда мать будущего композитора уехала вместе с ним в Канны, подальше от военных действий. Именно в Каннах юный Клод в 1870 году начал брать первые уроки фортепиано; по возвращении в Париж занятия продолжились под руководством Антуанетты Моте де Флёрвиль, тёщи поэта Поля Верлена, к тому же называвшей себя ученицей Фредерика Шопена."}, {"id": 82, "q": "Когда родился Периклис Каллидόпулос?", "p": "Хулиарас, Георгиос Георгиос Хулиарас (, 1914 — 3 ноября 2001), известный также как Капитан Периклис () — греческий коммунист, командир подразделений Народно-освободительной армии Греции (ЭЛАС) и Демократической армии Греции (ДСЭ)."}, {"id": 83, "q": "Где был найден бюст Нефертити?", "p": "Амарна В 1907 году Германское восточное общество под руководством Людвига Борхардта, обнаружившего знаменитый бюст Нефертити, продолжили раскопки. Первая мировая война прервала исследования, однако после её окончания они продолжились. Позже в раскопках эль-Амарны принимали участие Генри Франкфорт, Чарльз Леонард Вулли и др."}, {"id": 84, "q": "Ива́н Лукья́нович Солоне́вич издавал газету в Болгарии?", "p": "Утренний вестник По мнению общественности в Болгарии и болгар, живущих в Македонии, газета отличается открытой антиболгарской пропагандой и ненавистью к болгарам. Газета публикует и карикатуры, которые осмеивают и унижают болгар. В электронной версии газеты не допускаются какие-либо комментарии, написанные на болгарском языке."}, {"id": 85, "q": "Чем известен Фла́вий Пётр Савва́тий Юстиниа́н?", "p": "Велизарий Фла́вий Велиза́рий (Велиса́рий) (; ; ок. 505 — ) — византийский военачальник времён императора Юстиниана Великого. Консул 535 года. Один из величайших полководцев византийской истории."}, {"id": 86, "q": "Когда родился Диоклетиан?", "p": "Солин Римский император Диоклетиан, предположительно родившийся в этом городе, пожаловал Салоне почётный титул императорской фамилии «Валерия»."}, {"id": 87, "q": "Какой титул был у Ленина когда он был во главе СССР?", "p": "Ленин, Владимир Ильич В 1919—1921 годах Ленин записал на граммофонных пластинках 16 речей. Единственной официальной государственной наградой Ленина был Орден Труда Хорезмской народной советской республики (что делает Ленина первым кавалером данного ордена). Других государственных наград, как РСФСР и СССР, так и иностранных государств, у Ленина не было."}, {"id": 88, "q": "Что находится в горбах у верблюда?", "p": "Одногорбый верблюд В отличие от бактрианов, дромедары имеют лишь один горб. Они гораздо мельче своих двугорбых родственников: их длина составляет от 2,3 до 3,4 м, а высота в холке — от 1,8 до 2,3 м. Вес дромедаров составляет от 300 до 700 кг. Хвост относительно короткий, не длиннее 50 см. Дромадер отличается довольно стройным телосложением и длинными ногами, а в его окраске преобладают пепельно-жёлтые тона. Шерсть у одногорбого верблюда как правило песчаного цвета, однако встречаются и другие окраски: от белого до тёмно-коричневого. Верхняя часть головы, шея и спина покрыты более длинными волосами. У одногорбых верблюдов длинная шея, на которой расположена вытянутая голова. Верхняя губа раздвоена, а ноздри имеют щелеобразную форму и верблюд может их при необходимости закрыть. На веках у него очень длинные ресницы. На коленях, ступнях и других частях тела у одногорбого верблюда многочисленные мозоли. На ногах, как у всех верблюдовых, имеются всего два пальца, заканчивающиеся не копытами, а мозолевыми подушками. Желудок состоит, как и у близких родичей, из нескольких камер, что облегчает пищеварение при растительном питании."}, {"id": 89, "q": "Что такое Хрущевские постройки?", "p": "Чернявский, Илья Зиновьевич Илья Зиновьевич Чернявский (1917—1994) — советский архитектор, Заслуженный архитектор РФ, член-корреспондент Международной академии архитектуры в г. Москве. Один из немногих советских архитекторов, кому удавалось в хрущевский период «борьбы с излишествами» в архитектуре воплощать неординарные и эмоционально-насыщенные пространства. Постройки Чернявского стали лицом советской архитектуры в западных изданиях. В конкурсах Госгражданстроя и Союза Архитекторов на «Лучший проект» и «Постройку года» проекты Чернявского многократно отмечены премиями.В 1955 году, в начале эпохи Н. С. Хрущёва вышло постановление ЦК КПСС Об устранении излишеств в проектировании и строительстве. После выхода этого документа не только прекратилось строительство в стиле Советского монументального классицизма, но предельно были упрощены все архитектурные решения. Типизация форм должна была ускорить обеспечение населения жильём и утвердить новые ориентиры Коммунистической партии: функционализм и экономичность. Были упразднены все детали зданий, типизированы объемы, индустриализация поглотила возможности архитектурного творчества. В этой среде Илья Чернявский оказался одним из немногих, кому удавалось отстаивать развитие архитектуры и создавать не типовые образы. Его работа в ЦНИИЭП лечебно-курортных зданий способствовала этому. Здания рекреационного назначения, часто располагающиеся на рельефе, морских и речных берегах, всё же требуют индивидуального подхода и не могут быть типизированы."}, {"id": 90, "q": "Почему началась операция «Несокрушимая скала»?", "p": "Хронология операции «Нерушимая скала» Глава правительства Биньямин Нетаньяху выразил от имени всех граждан Израиля глубочайшую скорбь в связи с убийством мальчика и передал искренние соболезнования его родным. «ХАМАС дорого заплатит за этот теракт, — сказал Нетаньяху. — Армия обороны Израиля и ШАБАК сделают всё необходимое, чтобы цели антитеррористической операции „Несокрушимая скала“ были достигнуты». ВВС ЦАХАЛа нанесли удар по дому одного из боевиков ХАМАСа, ответственных за ракетные обстрелы Израиля. За день атакованы 35 объектов инфраструктуры террористов. За последние три дня — после того как ХАМАС в 11-й раз нарушил режим прекращения огня — по сектору Газа с воздуха нанесено 200 ударов. 23 боевика убиты, в том числе методом точечных ликвидаций."}, {"id": 91, "q": "Сколько людей погибло в шко́ле «Колумба́йн»?", "p": "Школа № 11 Шко́ла № 11:"}, {"id": 92, "q": "В каком году был подписан Комплекс мер по выполнению Минских соглашений, Второе минское соглашение?", "p": "Хронология вооружённого конфликта на востоке Украины 11-12 февраля 2015 года на 17-часовых переговорах в Минске лидеры России, Германии, Франции и Украины согласовали Комплекс мер по выполнению Минских соглашений. Согласно Комплексу мер с 15 февраля в силу вступил режим прекращения огня. Несмотря на вступившее в силу перемирие, до 18 февраля в Дебальцево шли бои. Лишь после занятия Дебальцево повстанцами на линии соприкосновения наступило полное затишье."}, {"id": 93, "q": "Кто снялся в главной роли в «Звёздные врата SG-1»?", "p": "Звёздные врата: SG-1 «Звёздные врата SG-1» (), часто называемый просто SG-1, — научно-фантастический телевизионный сериал, снятый при участии США и Канады и номинированный на премию «Эмми», основан на вселенной звёздных врат компании MGM. Сериал создан Брэдом Райтом и Джонатаном Гласснером по мотивам фильма 1994 года «Звёздные врата» Дина Девлина и Роланда Эммериха. Эпизоды снимались в районе Ванкувера в Канаде. Брэд Райт, Джонатан Гласснер и Роберт Купер являются основными идейными вдохновителями сериала на разных этапах его производства. Первые пять сезонов, начиная с 1997 года, «Звёздные врата SG-1» транслировались на телеканале Showtime. Остальные пять сезонов были показаны на канале Sci Fi Channel. Показ финального эпизода состоялся на английском телеканале Sky1 13 марта 2007 года, за три месяца до американской премьеры. В этом же году «Звёздные врата SG-1», состоящие из 10 сезонов (214 серий), побили рекорд сериала «Секретные материалы», считавшегося самым продолжительным американским научно-фантастическим сериалом."}, {"id": 94, "q": "Когда родился Я́сир Арафа́т?", "p": "Кадыров, Рамзан Ахматович Рамзан Кадыров женат на односельчанке Медни Мусаевне Айдамировой (род. 7 сентября 1978), с которой познакомился ещё в школе. Медни работает модельером и в октябре 2009 года основала в Грозном дом моды «Firdaws», который выпускает мусульманскую одежду. У них десять детей: четыре сына — Ахмат (род. 8 ноября 2005, назван в честь деда), Зелимхан (род. 14 декабря 2006), Адам (род. 24 ноября 2007) и Абдуллах (род. 10 октября 2016); шесть дочерей — Айшат (род. 31 декабря 1998), Карина (род. 17 января 2000), Хеди (род. 21 сентября 2002), Табарик (род. 13 июля 2004), Ашура (род. 12 декабря 2012) и Эйшат (род. 13 января 2015). Два приёмных сына (сироты из детского приюта) были усыновлены Кадыровым в 2007 году."}, {"id": 95, "q": "На каком расстоянии находится Новомосковск от Москвы?", "p": "Мешково (Новомосковский административный округ) Деревня Мешково находится в северной части Новомосковского административного округа, примерно в 26 км к юго-западу от центра города Москвы и 2 км к юго-западу от центра города Московский, у Киевского шоссе , на правом берегу реки Ликовы бассейна Пахры."}, {"id": 96, "q": "Когда было начато строительство Саграды Фамилии?", "p": "Описсо, Рикард С 1892 года в течение семи лет он работал чертёжником у архитектора Антонио Гауди во время строительства храма Саграда Фамилия в Барселоне. Работая с Гауди, он постоянно изучал природу и жизнь во всех её проявлениях, «держа в руках» огромное количество её видов и форм, что в дальнейшем послужило ему материалом для публикации своих костумбритских (бытовых) заметок в еженедельниках и журналах Барселоны."}, {"id": 97, "q": "В каком городе родился И́горь Миха́йлович Дья́конов?", "p": "Дьяконов, Кирилл Николаевич Кири́лл Никола́евич Дья́конов (род. 20 сентября 1941, Москва) — российский физико-географ, ландшафтовед. Доктор географических наук (1985), профессор (1985), Заслуженный профессор МГУ (2007), член-корреспондент Российской академии наук (2003)."}, {"id": 98, "q": "Что означает слово \"Эли́зиум\"?", "p": "Сати (ритуал) Причина такого разночтения в том, что согласный звук в слове, означающем \"дом\", был преднамеренно заменён на другой, в результате получилось слово, означающее \"костёр\"."}, {"id": 99, "q": "В какой категории Энтони Гидденс стал лауреатом премии принца Астурийского?", "p": "Гидденс, Энтони В политической сфере выступил как теоретик «нового лейборизма» и «третьего пути». В июне 2004 года за свои заслуги Гидденс получил пожизненный титул пэра, стал лордом и бароном Саутгейта. С 2005 года он заседает в качестве члена Палаты лордов Парламента Великобритании, представляя партию лейбористов."}, {"id": 100, "q": "Когда была организована Армия Крайова?", "p": "Агат (Армия Крайова) Поздней весной 1943 года «тихотёмный» капитан Армии Крайовой получил приказ об организации диверсионного подразделения. Он обратился к руководству «Серых шеренг» с просьбой о передачи ему в распоряжение 75 харцеров. Окончательно подразделение было создано в конце июля — начале августа (официально называется дата 1 августа 1943). В ходе реорганизации «Серых шеренг» новый отряд получил официальное задание от , заключавшееся в поиске и ликвидации особо опасных нацистских преступников и карателей. Информацию о лицах, подлежащих уничтожению, сообщало Польское подпольное государство."}];
const KEY = "pair-labels-v2";
const OPTS = [["relevant", "Релевантен"], ["not_relevant", "Не релевантен"], ["unsure", "Не понять"]];
let labels = {};
try { labels = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { labels = {}; }
let cur = 0;
const list = document.getElementById("list");

PAIRS.forEach((p, i) => {
  const c = document.createElement("section");
  c.className = "card"; c.id = "c" + p.id;
  c.innerHTML = `<div class="num">${p.id} / ${PAIRS.length}</div>
    <div class="lbl">Запрос</div><div class="q"></div>
    <div class="lbl">Фрагмент</div><div class="p"></div><div class="btns"></div>`;
  c.querySelector(".q").textContent = p.q;
  c.querySelector(".p").textContent = p.p;
  const b = c.querySelector(".btns");
  OPTS.forEach(([v, t], j) => {
    const btn = document.createElement("button");
    btn.dataset.v = v;
    btn.innerHTML = `<kbd>${j + 1}</kbd>`;
    btn.append(t);
    btn.onclick = () => { setCur(i, false); mark(v); };
    b.append(btn);
  });
  c.addEventListener("click", () => setCur(i, false));
  list.append(c);
});

function save() { try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch (e) {} }
function paint(i) {
  const p = PAIRS[i], c = document.getElementById("c" + p.id);
  c.querySelectorAll("button").forEach(b => b.classList.toggle("on", labels[p.id] === b.dataset.v));
}
function progress() {
  const n = PAIRS.filter(p => labels[p.id]).length;
  document.getElementById("count").textContent = `Размечено ${n} из ${PAIRS.length}`;
  document.getElementById("bar").style.width = (100 * n / PAIRS.length) + "%";
}
function setCur(i, scroll = true) {
  i = Math.max(0, Math.min(PAIRS.length - 1, i));
  document.querySelectorAll(".card.cur").forEach(c => c.classList.remove("cur"));
  cur = i;
  const c = document.getElementById("c" + PAIRS[i].id);
  c.classList.add("cur");
  if (scroll) c.scrollIntoView({ behavior: "smooth", block: "start" });
}
function firstOpen() { const k = PAIRS.findIndex(p => !labels[p.id]); return k < 0 ? PAIRS.length - 1 : k; }
function mark(v) {
  labels[PAIRS[cur].id] = v; save(); paint(cur); progress();
  if (cur < PAIRS.length - 1) setCur(cur + 1);
}
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = { "1": 0, "2": 1, "3": 2 }[e.key];
  if (k !== undefined) { e.preventDefault(); mark(OPTS[k][0]); }
  else if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); setCur(cur + 1); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); setCur(cur - 1); }
});
document.getElementById("next").onclick = () => setCur(firstOpen());
document.getElementById("dl").onclick = () => {
  const n = PAIRS.filter(p => labels[p.id]).length;
  if (n < PAIRS.length && !confirm(`Размечено ${n} из ${PAIRS.length}. Всё равно скачать?`)) return;
  const out = PAIRS.filter(p => labels[p.id]).map(p => ({ id: p.id, label: labels[p.id] }));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
  a.download = "human_labels.json";
  document.body.append(a); a.click(); a.remove();
};
PAIRS.forEach((_, i) => paint(i));
progress();
setCur(firstOpen(), false);
if (cur > 0) setTimeout(() => setCur(cur), 50);
</script>

</html>
